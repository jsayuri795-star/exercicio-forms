<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>
<body>
    <h1>Calculadora</h1>
    <label for= "numero1">primeiro numero; </label>
    <input type="number" id="numero1">

    <br><br>
    
    <label for="numero2">segundo numero; </label>
    <input type="number" id="numero2">

    <br><br>

    <button onclick=somar()>
        Somar
    </button>
    <button onclick=subtrair()>
        Subtrair
    </button>
     <button onclick=dividir()>
        Dividir
    </button>
     <button onclick=multiplicar()>
        multiplicar
    </button>

    <p id="resultado"</p>

   <script>
     function somar() {
            const campoNumero1 = document.getElementById("numero1");
            const campoNumero2 = document.getElementById("numero2");

            const numero1 = Number(campoNumero1.value);
            const numero2 = Number(campoNumero2.value);

            const resultado = numero1 + numero2;
            const campoResultado = document.getElementById("resultado");

            campoResultado.textContent = "Resultado: " + resultado;
        } 
         function subtrair() {
            const campoNumero1 = document.getElementById("numero1");
            const campoNumero2 = document.getElementById("numero2");

            const numero1 = Number(campoNumero1.value);
            const numero2 = Number(campoNumero2.value);

            const resultado = numero1 - numero2;
            const campoResultado = document.getElementById("resultado");

            campoResultado.textContent = "Resultado: " + resultado;
        } 
        function dividir() {
            const campoNumero1 = document.getElementById("numero1");
            const campoNumero2 = document.getElementById("numero2");

            const numero1 = Number(campoNumero1.value);
            const numero2 = Number(campoNumero2.value);
           if(numero2 === 0){
            const campoResultado=document.getElementById("resultado")
            campoResultado.textContent="Inválido"

           }else{
            const resultado = numero1 / numero2;
            const campoResultado = document.getElementById("resultado");
            campoResultado.textContent = "Resultado: " + resultado;
           }
        } 
        function multiplicar() {
            const campoNumero1 = document.getElementById("numero1");
            const campoNumero2 = document.getElementById("numero2");

            const numero1 = Number(campoNumero1.value);
            const numero2 = Number(campoNumero2.value);

            const resultado = numero1 * numero2;
            const campoResultado = document.getElementById("resultado");

            campoResultado.textContent = "Resultado: " + resultado;
        } 
  </script>

    
</body>
</html>

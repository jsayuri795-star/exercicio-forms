<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário</h1>
    <form>
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label>Nome</label>
            <input type="text">
            <br><br>

            <label>Endereço</label>
            <input type="text">
            <br><br>

            <label>Cidade</label>
            <input type="text">
            <br><br>

            <label>Estado</label>
            <select>
                <option>São Paulo</option>
                <option>Rio de Janeiro</option>
                <option>Minas Gerais</option>
            </select>
        </fieldset>
        <br><br>
        
        <fieldset>
            <legend>Dados Profissionais</legend>
            <p>Natureza do Cargo</p>
            <input type="radio" name="cargo" checked>
            Gerência
            <input type="radio" name="cargo" checked>
            Financeiro
            <input type="radio" name="cargo" checked>
            Recepção
            <input type="radio" name="cargo" checked>
            Admnistrativo
            <input type="radio" name="cargo" checked>
            Juridico

            <p>Área de interesse</p>
            <input type="checkbox">
            Computação
             <input type="checkbox">
            Biologia
            <input type="checkbox">
            Meio Ambiente
            <input type="checkbox">
            Engenharia
            <input type="checkbox">
            História
            <br><br>

            <label>Mini Currículo</label>
            <br>
            <textarea rows="8" cols="50"></textarea>
        </fieldset>

    </form>
</body>
</html>

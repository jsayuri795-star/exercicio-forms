<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Manutenção de usuários do sistema</h1>
    <form>
        <label>Login</label>
        <input type="text">
        <br><br>
        <label>Status</label>
        <select>
            <option>Inativo</option>
            <option>Ativo</option>
        </select>
        <br><br>
        <label>Tipo</label>
          <input type="radio" name="tipo"> Técnico
          <input type="radio" name="tipo"> Professor
          <input type="radio" name="tipo"> Aluno
          <br><br>

          <label>Data de Criação</label>
          <input type="date">
          <br><br>

          <label>Perfil</label>
          <input type="radio" name="perfil"> Convidado
           <input type="radio" name="perfil"> Adm
           <br><br>

           <label>Observações</label>
           <br>
           <textarea rows="8" cols="50"></textarea>
           <br><br>

           <label>Módulos</label>
           <br>
           <input type="checkbox"> Compras
           <input type="checkbox"> Biblioteca
           <input type="checkbox"> Acadêmico
           <br><br>

           <input type="checkbox"> Documentação
           <input type="checkbox"> Recursos Humanos
           <br><br>

         <button type="submit">Cadastrar</button>
          <button type="reset">Excluir</button>
    </form>
</body>
</html>
